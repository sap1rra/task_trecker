
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}TaskFlow{% endblock %}</title>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f6f7fb;
            color: #25243a;
        }

        a {
            text-decoration: none;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #ececf3;
            padding: 30px 20px;
            position: fixed;
            top: 0;
            left: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            font-weight: 700;
            color: #25243a;
            margin-bottom: 55px;
        }

        .logo:hover {
            color: #7165e9;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #7165e9;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: 700;
        }

        .menu-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #a4a3b5;
            margin: 0 0 15px 12px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 15px;
            border-radius: 10px;
            color: #77768b;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .menu-link span {
            font-size: 19px;
        }

        .menu-link:hover {
            background: #f0efff;
            color: #7165e9;
        }

        .main-content {
            width: calc(100% - 250px);
            min-height: 100vh;
            margin-left: 250px;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
                padding: 25px 15px;
            }

            .main-content {
                width: calc(100% - 200px);
                margin-left: 200px;
                padding: 25px 20px;
            }
        }

        @media (max-width: 576px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                padding: 18px 20px;
                border-right: none;
                border-bottom: 1px solid #ececf3;
            }

            .logo {
                margin-bottom: 20px;
            }

            .main-content {
                width: 100%;
                margin-left: 0;
                padding: 22px 16px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <a href="{% url 'task_list' %}" class="logo">
            <span class="logo-icon">T</span>
            TaskFlow
        </a>

        <div class="menu-title">WORKSPACE</div>

        <nav class="sidebar-menu">

            <a href="{% url 'task_list' %}" class="menu-link">
                <span>▤</span>
                My Tasks
            </a>

        </nav>

    </aside>

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
